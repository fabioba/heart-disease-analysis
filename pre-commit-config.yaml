repos:
  # --- General hygiene ---
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: debug-statements       # catches leftover breakpoint() / pdb
      - id: check-added-large-files
        args: ["--maxkb=1000"]

  # --- Python formatting ---
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.9
    hooks:
      - id: ruff                   # linter (replaces flake8, isort, pyupgrade)
        args: [--fix]
      - id: ruff-format            # formatter (replaces black)

  # --- SQL / dbt ---
  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 3.1.0
    hooks:
      - id: sqlfluff-lint
        args: [--dialect, bigquery]   # ← change to: snowflake / spark / duckdb / etc.
        additional_dependencies:
          - dbt-core
          - dbt-bigquery              # ← match your adapter
      - id: sqlfluff-fix
        args: [--dialect, bigquery]
        additional_dependencies:
          - dbt-core
          - dbt-bigquery

  # --- dbt project checks ---
  - repo: https://github.com/dbt-checkpoint/dbt-checkpoint
    rev: v2.0.3
    hooks:
      - id: check-model-has-description
      - id: check-model-has-tests
        args: ["--test-cnt", "1"]     # every model needs at least 1 test
      - id: check-source-has-loader

  # --- Secrets detection ---
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
